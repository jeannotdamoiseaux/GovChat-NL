model_list:
  - model_name: gpt-4.1-nano
    litellm_params:
      model: azure_ai/gpt-4.1-nano
      api_base: os.environ/AZURE_API_BASE # runs os.getenv("AZURE_API_BASE"), change in your environment (.env file) after "cp -RPp .env.example .env"
      api_key: os.environ/AZURE_API_KEY # runs os.getenv("AZURE_API_KEY")
      api_version: os.environ/AZURE_API_VERSION # runs os.getenv("AZURE_API_VERSION"
  - model_name: azure-gpt-5.6-luna
    litellm_params:
      model:  azure_ai/gpt-5.6-luna
      reasoning_effort: none # gpt-5.6-luna accepteert geen function tools i.c.m. reasoning_effort op /v1/chat/completions
      api_base: os.environ/AZURE_API_BASE # runs os.getenv("AZURE_API_BASE")
      api_key: os.environ/AZURE_API_KEY # runs os.getenv("AZURE_API_KEY")
      api_version: os.environ/AZURE_API_VERSION # runs os.getenv("AZURE_API_VERSION")